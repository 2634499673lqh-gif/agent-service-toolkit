name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.5"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Validate lockfile
      run: uv lock --check
    - name: Run Phase 8 cheap Evaluation smoke
      run: uv run python scripts/evaluation_smoke.py > evaluation-smoke.json
    - name: Upload Phase 8 Evaluation smoke report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: evaluation-smoke-${{ matrix.python-version }}
        path: evaluation-smoke.json

    - name: Lint and format with ruff
      run: |
        uv run ruff format --check
        uv run ruff check --output-format github

    - name: Type check with pyrefly
      run: |
        uv run pyrefly check

    - name: Test with pytest
      run: |
        uv run pytest --cov=src/ --cov-report=xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  lint-markdown:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.5"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen --only-group dev
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint markdown with pymarkdown
      run: |
        uv run pymarkdown scan README.md docs/

  test-docker:
    runs-on: ubuntu-latest

    services:
      dind:
        image: docker:dind
        ports:
          - 2375:2375
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Build service image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: agent-service-toolkit.service:${{ github.sha }}
          file: docker/Dockerfile.service

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: agent-service-toolkit.app:${{ github.sha }}
          file: docker/Dockerfile.app

      - name: Start service container
        run: docker run -d --name service-container --network host -e USE_FAKE_MODEL=true -e PORT=80 agent-service-toolkit.service:${{ github.sha }}

      - name: Confirm service starts correctly
        run: |
          timeout 30 bash -c '
            while ! curl -s http://0.0.0.0/health; do
              echo "Waiting for service to be ready..."
              docker logs service-container
              sleep 2
            done
          '

      - name: Run app container
        run: docker run -d --name app-container --network host -e AGENT_URL=http://0.0.0.0 agent-service-toolkit.app:${{ github.sha }}

      - name: Confirm app starts correctly
        run: |
          timeout 30 bash -c '
            while ! curl -s http://localhost:8501/healthz; do
              echo "Waiting for app to be ready..."
              docker logs app-container
              sleep 2
            done
          '

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Install ONLY CLIENT dependencies with uv
        run: |
          uv sync --frozen --only-group client --only-group dev
        env:
          UV_SYSTEM_PYTHON: 1
      - name: Run integration tests
        run: |
          uv run pytest tests/integration -v --run-docker
        env:
          AGENT_URL: http://0.0.0.0

      - name: Collect Docker diagnostics
        if: always()
        run: |
          mkdir -p docker-evidence
          docker info > docker-evidence/docker-info.txt 2>&1 || true
          docker buildx ls > docker-evidence/buildx-ls.txt 2>&1 || true
          docker buildx inspect > docker-evidence/buildx-inspect.txt 2>&1 || true
          docker compose config > docker-evidence/compose-config.txt 2>&1 || true
          docker compose ps -a > docker-evidence/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > docker-evidence/compose.log 2>&1 || true
          docker ps -a > docker-evidence/docker-ps.txt 2>&1 || true
          docker images > docker-evidence/docker-images.txt 2>&1 || true
          docker inspect service-container > docker-evidence/service-inspect.json 2>&1 || true
          docker inspect app-container > docker-evidence/app-inspect.json 2>&1 || true
          docker logs service-container > docker-evidence/service.log 2>&1 || true
          docker logs app-container > docker-evidence/app.log 2>&1 || true

      - name: Upload Docker diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-evidence-${{ github.sha }}
          path: docker-evidence/
          if-no-files-found: warn

      - name: Clean up containers
        if: always()
        run: |
          docker stop service-container app-container || true
          docker rm service-container app-container || true

  test-postgres:
    name: PostgreSQL integration and concurrency evidence
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_SYSTEM_PYTHON: 1
      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          TASKPILOT_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/taskpilot_test
      - name: Run PostgreSQL race and multi-user smoke
        run: uv run pytest tests/service/test_approval_api_postgres.py tests/service/test_task_api_postgres.py -m postgres -v
        env:
          TASKPILOT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/taskpilot_test
      - name: Upload PostgreSQL logs
        if: always()
        run: docker logs $(docker ps -q --filter ancestor=postgres:16) > postgres.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postgres-evidence
          path: postgres.log

  compose-e2e:
    name: Compose end-to-end (explicit Docker job)
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_COMPOSE_E2E == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build and start supported stack
        run: docker compose up -d --build
      - name: Verify service and UI health
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/health/ready; do sleep 3; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:8501/healthz; do sleep 3; done'
          docker compose ps
      - name: Verify restart and migration state
        run: |
          docker compose restart agent_service
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/health/ready; do sleep 3; done'
          docker compose run --rm migrate
      - name: Collect Compose evidence
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-evidence
          path: compose.log
      - name: Stop stack
        if: always()
        run: docker compose down
