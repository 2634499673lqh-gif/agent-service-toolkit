services:
  postgres:
    image: postgres:16
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-agent_service}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      PYTHONPATH: /app
      USE_FAKE_MODEL: "true"
      TASKPILOT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agent_service}
    depends_on:
      postgres:
        condition: service_healthy
  agent_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    ports:
      - "18080:8080"
    env_file:
      - .env
    environment:
      DATABASE_TYPE: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
      TASKPILOT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agent_service}
      USE_FAKE_MODEL: "true"
      ALLOW_NO_LLM: "true"
      GEOCHANGE_LIVE_LLM: "true"
      GEOCHANGE_LIVE_STAC: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./privatecredentials:/privatecredentials
      - ./data/geochange-artifacts:/app/data/geochange-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/health/ready', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  postgres_data:
